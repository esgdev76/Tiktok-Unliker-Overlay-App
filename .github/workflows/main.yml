name: Build TikTok Unlike Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q TikTokUnlikeAssistant.zip -d extracted

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/TikTokUnlikeAssistant/app/build.gradle.kts")
          s = p.read_text()

          fix = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          s = s.replace(
              "    defaultConfig {",
              fix + "\\n    defaultConfig {",
              1
          )

          p.write_text(s)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p extracted/TikTokUnlikeAssistant assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Unlike-Assistant-APK
          path: extracted/TikTokUnlikeAssistant/app/build/outputs/apk/debug/app-debug.apk
