name: Build TikTok Unlike Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q TikTokUnlikeAssistant.zip -d extracted
          ls -la extracted

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p extracted/TikTokUnlikeAssistant assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Unlike-Assistant-APK
          path: extracted/TikTokUnlikeAssistant/app/build/outputs/apk/debug/app-debug.apk
