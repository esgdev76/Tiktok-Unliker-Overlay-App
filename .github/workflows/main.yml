
name: Build TikTok Unlike Assistant V2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q TikTokUnlikeAssistantV2.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/TikTokUnlikeAssistantV2 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unlike-Assistant-V2
          path: extracted/TikTokUnlikeAssistantV2/app/build/outputs/apk/debug/app-debug.apk
