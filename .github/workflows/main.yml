
name: Build TikTok Unlike Assistant V2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q TikTokUnlikeAssistantV2.zip -d extracted

      - name: Fix floating icon Kotlin type
        shell: bash
        run: |
          FILE=$(find extracted -name OverlayService.kt -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "OverlayService.kt not found!"
            find extracted -type f
            exit 1
          fi

          echo "Found file: $FILE"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace(
              "private var bubble: TextView? = null",
              "private var bubble: View? = null"
          )
          p.write_text(s)
          print("Floating icon type fixed.")
          PY

      - name: Build APK
        shell: bash
        run: |
          GRADLE_FILE=$(find extracted -path '*/app/build.gradle.kts' -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$GRADLE_FILE")")

          echo "Building project: $PROJECT_DIR"

          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unlike-Assistant-V2
          path: extracted/TikTokUnlikeAssistantV2/app/build/outputs/apk/debug/app-debug.apk
