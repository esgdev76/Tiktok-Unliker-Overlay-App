
name: Build TikTok Unlike Assistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q TikTokUnlikeAssistant.zip -d extracted

      - name: Fix Android Gradle configuration
        run: |
          cat > extracted/TikTokUnlikeAssistant/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.tiktokunlikeassistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.tiktokunlikeassistant"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p extracted/TikTokUnlikeAssistant assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Unlike-Assistant-APK
          path: extracted/TikTokUnlikeAssistant/app/build/outputs/apk/debug/app-debug.apk
